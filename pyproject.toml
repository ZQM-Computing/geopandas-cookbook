[project]
name = "geopandas-cookbook"
version = "0.1.0"
description = "GeoPandas/Shapely patterns for Python geospatial workflows"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "ZQM Computing", email = "zqmcomputing@gmail.com"}]
keywords = ["geopandas", "shapely", "pyogrio", "python", "geospatial", "gis"]
dependencies = [
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyogrio>=0.7",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
postgis = ["psycopg[binary]>=3.2", "sqlalchemy>=2.0"]
interactive = ["folium>=0.15"]

[project.urls]
Homepage = "https://github.com/ZQM-Computing/geopandas-cookbook"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
