site_name: GeoPandas Cookbook
site_url: https://geopandas.zqmlabs.com/
site_description: GeoPandas/Shapely patterns — spatial joins, CRS handling, overlay, interpolation, performance
site_author: ZQM Computing
repo_url: https://github.com/ZQM-Computing/geopandas-cookbook

theme:
  name: material
  custom_dir: docs/overrides
  features:
    - navigation.tabs
    - navigation.sections
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - codehilite
  - toc:
      permalink: true

nav:
  - Home: index.md
