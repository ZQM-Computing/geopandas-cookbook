site_name: GeoPandas Cookbook
site_url: https://geopandas.zqmlabs.com/
site_description: Runnable GeoPandas and Shapely tutorials for spatial joins, CRS handling, overlays, geometry validation, interpolation, and Python geospatial analysis.
site_author: ZQM Computing
repo_url: https://github.com/ZQM-Computing/geopandas-cookbook

theme:
  name: material
  custom_dir: docs/overrides
  features:
    - navigation.tabs
    - navigation.sections
    - search.suggest
    - search.highlight

markdown_extensions:
  - meta
  - admonition
  - codehilite
  - toc:
      permalink: true

nav:
  - Home: index.md
